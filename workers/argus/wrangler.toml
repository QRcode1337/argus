name = "argus"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Option A: Worker in front of Tunnel/origin for argusweb.bond
routes = [
  { pattern = "argusweb.bond/*", zone_name = "argusweb.bond" }
]

[ai]
binding = "AI"

# Secrets (set via `wrangler secret put`):
#   ANALYZE_SECRET  — shared secret for /analyze (Authorization: Bearer …)
#   CF_API_TOKEN    — Cloudflare API token with Analytics Read
#   CF_ACCOUNT_ID   — Cloudflare account id for GraphQL Analytics
# Origin passthrough uses the existing Tunnel CNAME; do not put env.AI on every hit.
